<text x="1386" y="557" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">KnowledgeClient: firma + versión</text>
<text x="1386" y="588" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">IncidentTriage: bindings locales</text>
<text x="1386" y="619" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">Sin acciones nuevas ni código</text>
