<rect x="1163" y="1067" width="271" height="34" rx="0" fill="#E5F3ED"/>
<text x="1298" y="1091" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#247C66" font-weight="600" text-anchor="middle">Resultado + evidencia</text>
<rect x="60" y="1154" width="1200" height="182" rx="20" fill="white" stroke="#D6E0EA" stroke-width="1.5"/>
<text x="88" y="1199" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152B43" font-weight="700" text-anchor="start">DOS AUTORIZACIONES DISTINTAS</text>
<text x="88" y="1243" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#52667C" font-weight="400" text-anchor="start">La aprobación central permite compartir conocimiento.</text>
<text x="88" y="1277" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#52667C" font-weight="400" text-anchor="start">La aprobación local autoriza una actuación concreta en ese nodo.</text>
<text x="88" y="1311" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#52667C" font-weight="400" text-anchor="start">El LLM no firma aprobaciones ni decide permisos.</text>
<rect x="1340" y="1154" width="520" height="182" rx="20" fill="#FFF3E2" stroke="#EAD0AE" stroke-width="1.5"/>
<text x="1368" y="1199" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#A56110" font-weight="700" text-anchor="start">SI FALLA LA COMPROBACIÓN</text>
<text x="1368" y="1243" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#152B43" font-weight="400" text-anchor="start">Intentar restaurar el estado previo.</text>
<text x="1368" y="1277" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#152B43" font-weight="400" text-anchor="start">Guardar también fallos de rollback.</text>
<text x="1368" y="1311" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#152B43" font-weight="400" text-anchor="start">No declarar éxito sin postcheck.</text>
<line x1="1600" y1="1113" x2="1600" y2="1141" stroke="#A56110" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="60" y="1402" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#52667C" font-weight="400" text-anchor="start">Alcance: PoC local controlada. El backend LLM real y cada acción deben acreditarse con su evidencia de ejecución.</text>
