<text x="106" y="742" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">LLM local + catálogo autorizado</text>
<text x="106" y="773" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">Enlaza evidencia con IDs existentes</text>
<text x="106" y="804" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">No crea código, permisos ni firmas</text>
