<text x="706" y="742" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">Quórum + firmas + caducidad</text>
<text x="706" y="773" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">Revocación + versión monotónica</text>
<text x="706" y="804" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">Entrada confirmed + evidencia</text>
