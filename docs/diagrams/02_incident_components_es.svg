<text x="1386" y="729" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#247C66" font-weight="700" text-anchor="start">LocalApproval</text>
<text x="1386" y="768" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">Incidente · paquete · bindings · raíz</text>
<text x="1386" y="799" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">Caducidad; externa al modelo</text>
<rect x="1364" y="876" width="472" height="174" rx="14" fill="white" stroke="#D6E0EA" stroke-width="1.5"/>
<text x="1386" y="914" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#247C66" font-weight="700" text-anchor="start">ScopedExecutor</text>
<text x="1386" y="953" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">disable_npm_hook / quarantine_file</text>
<text x="1386" y="984" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">Precheck → aplicar → postcheck</text>
<text x="1386" y="1015" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">Hashes exactos · journal local</text>
