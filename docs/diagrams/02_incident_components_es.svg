<title id="title">LLM-AVChain: componentes y límites de confianza</title><desc id="desc">Flujo de datos y controles del recorrido de incidentes: recogida acotada, inferencia local no confiable, aprobación firmada, almacén versionado y ejecución local tipada con restauración ante fallo.</desc>
