<text x="706" y="914" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#7455B7" font-weight="700" text-anchor="start">Ledger SQL + evidencia</text>
<text x="706" y="953" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="400" text-anchor="start">Paquete aprobado y evidencia vinculada</text>
