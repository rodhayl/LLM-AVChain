<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1880" viewBox="0 0 1920 1880" role="img" aria-labelledby="title desc">
<title id="title">LLM-AVChain: secuencia del incidente a la acción local</title><desc id="desc">Secuencia lógica: el nodo A crea conocimiento aprobado, el nodo B consulta una versión vigente y adapta una variante, una aprobación local autoriza acciones fijas; el ejecutor comprueba, revierte ante fallo y devuelve evidencia.</desc>
<defs>
<marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 z" fill="#152B43"/></marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 z" fill="#147CAA"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 z" fill="#7455B7"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 z" fill="#247C66"/></marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 z" fill="#A56110"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 z" fill="#A5454A"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 z" fill="#52667C"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1880" rx="0" fill="#F5F7FB"/>
<rect x="60" y="35" width="235" height="36" rx="18" fill="#E5EAF4"/>
<text x="177.5" y="60" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#52667C" font-weight="600" text-anchor="middle">VISTA TÉCNICA · 2/2</text>
<text x="60" y="121" font-family="DejaVu Sans, sans-serif" font-size="43" fill="#152B43" font-weight="700" text-anchor="start">Del incidente a una acción local verificable</text>
<text x="60" y="169" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#52667C" font-weight="400" text-anchor="start">Secuencia lógica del recorrido · no presupone despliegue distribuido ni inferencia real</text>
<rect x="45.0" y="219" width="250" height="84" rx="12" fill="#E5F3FA" stroke="#147CAA" stroke-width="1.5"/>
<text x="170" y="253" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#147CAA" font-weight="700" text-anchor="middle">Nodo A</text>
<text x="170" y="281" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#52667C" font-weight="400" text-anchor="middle">IncidentNode</text>
<line x1="170" y1="304" x2="170" y2="1724" stroke="#D6E0EA" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="365.0" y="219" width="250" height="84" rx="12" fill="#E5F3FA" stroke="#147CAA" stroke-width="1.5"/>
<text x="490" y="253" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#147CAA" font-weight="700" text-anchor="middle">LLM local</text>
<text x="490" y="281" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#52667C" font-weight="400" text-anchor="middle">A y B</text>
<line x1="490" y1="304" x2="490" y2="1724" stroke="#D6E0EA" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="705.0" y="219" width="250" height="84" rx="12" fill="#EFEAFA" stroke="#7455B7" stroke-width="1.5"/>
<text x="830" y="253" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#7455B7" font-weight="700" text-anchor="middle">Centro compartido</text>
<text x="830" y="281" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#52667C" font-weight="400" text-anchor="middle">KnowledgeStore</text>
<line x1="830" y1="304" x2="830" y2="1724" stroke="#D6E0EA" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="1045.0" y="219" width="250" height="84" rx="12" fill="#E5F3ED" stroke="#247C66" stroke-width="1.5"/>
<text x="1170" y="253" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#247C66" font-weight="700" text-anchor="middle">Nodo B</text>
<text x="1170" y="281" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#52667C" font-weight="400" text-anchor="middle">IncidentNode</text>
<line x1="1170" y1="304" x2="1170" y2="1724" stroke="#D6E0EA" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="1375.0" y="219" width="250" height="84" rx="12" fill="#FFF3E2" stroke="#A56110" stroke-width="1.5"/>
<text x="1500" y="253" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#A56110" font-weight="700" text-anchor="middle">Permiso local</text>
<text x="1500" y="281" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#52667C" font-weight="400" text-anchor="middle">LocalApproval</text>
<line x1="1500" y1="304" x2="1500" y2="1724" stroke="#D6E0EA" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="1675.0" y="219" width="230" height="84" rx="12" fill="#E5F3ED" stroke="#247C66" stroke-width="1.5"/>
<text x="1790" y="253" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#247C66" font-weight="700" text-anchor="middle">Ejecutor local</text>
<text x="1790" y="281" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#52667C" font-weight="400" text-anchor="middle">ScopedExecutor</text>
<line x1="1790" y1="304" x2="1790" y2="1724" stroke="#D6E0EA" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="50" y="335" width="1815" height="40" rx="10" fill="#E4EBF4"/>
<text x="70" y="362" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="700" text-anchor="start">1. Crear conocimiento validado</text>
<text x="70" y="403" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#52667C" font-weight="400" text-anchor="start">Catálogo previo del operador</text>
<line x1="170" y1="467" x2="490" y2="467" stroke="#147CAA" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
<text x="330.0" y="429" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#147CAA" font-weight="400" text-anchor="middle">Evidencia no confiable</text>
<text x="330.0" y="455" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#147CAA" font-weight="400" text-anchor="middle">+ catálogo de acciones</text>
<line x1="490" y1="528" x2="170" y2="528" stroke="#147CAA" stroke-width="2.3" stroke-dasharray="8 5" marker-end="url(#arrow-blue)"/>
<text x="330.0" y="515" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#147CAA" font-weight="400" text-anchor="middle">Bindings propuestos</text>
<line x1="170" y1="583" x2="830" y2="583" stroke="#7455B7" stroke-width="2.3" marker-end="url(#arrow-purple)"/>
<text x="500.0" y="570" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#7455B7" font-weight="400" text-anchor="middle">Paquete + evidencia de A + firmas de validadores</text>
<rect x="680" y="611" width="590" height="79" rx="12" fill="#EFEAFA" stroke="#D6E0EA" stroke-width="1.5"/>
<text x="702" y="641" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#7455B7" font-weight="600" text-anchor="start">Verificar quórum, Ed25519, TTL y versión.</text>
<text x="702" y="672" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#7455B7" font-weight="400" text-anchor="start">Persistir paquete aprobado + evidencia.</text>
<rect x="50" y="720" width="1815" height="40" rx="10" fill="#E4EBF4"/>
<text x="70" y="747" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="700" text-anchor="start">2. Reutilizar la resolución en otra variante</text>
<line x1="1170" y1="810" x2="830" y2="810" stroke="#7455B7" stroke-width="2.3" marker-end="url(#arrow-purple)"/>
<text x="1000.0" y="797" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#7455B7" font-weight="400" text-anchor="middle">Consultar paquete vigente</text>
<line x1="830" y1="868" x2="1170" y2="868" stroke="#7455B7" stroke-width="2.3" stroke-dasharray="8 5" marker-end="url(#arrow-purple)"/>
<text x="1000.0" y="855" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#7455B7" font-weight="400" text-anchor="middle">Paquete verificado vN</text>
<line x1="1170" y1="929" x2="490" y2="929" stroke="#247C66" stroke-width="2.3" marker-end="url(#arrow-green)"/>
<text x="830.0" y="916" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#247C66" font-weight="400" text-anchor="middle">Evidencia de variante + IDs de acción aprobados</text>
<line x1="490" y1="987" x2="1170" y2="987" stroke="#147CAA" stroke-width="2.3" stroke-dasharray="8 5" marker-end="url(#arrow-blue)"/>
<text x="830.0" y="974" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#147CAA" font-weight="400" text-anchor="middle">Mapeo local; sin acciones nuevas</text>
<rect x="50" y="1030" width="1815" height="40" rx="10" fill="#E4EBF4"/>
<text x="70" y="1057" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152B43" font-weight="700" text-anchor="start">3. Autorizar, ejecutar y comprobar en el nodo B</text>
<line x1="1170" y1="1120" x2="1500" y2="1120" stroke="#A56110" stroke-width="2.3" marker-end="url(#arrow-amber)"/>
<text x="1335.0" y="1082" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#A56110" font-weight="400" text-anchor="middle">Plan y alcance local</text>
<text x="1335.0" y="1108" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#A56110" font-weight="400" text-anchor="middle">+ hashes exactos</text>
<line x1="1500" y1="1181" x2="1170" y2="1181" stroke="#A56110" stroke-width="2.3" stroke-dasharray="8 5" marker-end="url(#arrow-amber)"/>
<text x="1335.0" y="1168" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#A56110" font-weight="400" text-anchor="middle">Autorización del plan</text>
<line x1="1170" y1="1240" x2="830" y2="1240" stroke="#7455B7" stroke-width="2.3" marker-end="url(#arrow-purple)"/>
<text x="1000.0" y="1227" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#7455B7" font-weight="400" text-anchor="middle">Revalidar antes de escribir</text>
<line x1="1170" y1="1305" x2="1790" y2="1305" stroke="#247C66" stroke-width="2.3" marker-end="url(#arrow-green)"/>
<text x="1480.0" y="1292" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#247C66" font-weight="400" text-anchor="middle">Ejecutar plan validado</text>
<rect x="1340" y="1332" width="525" height="80" rx="12" fill="#E5F3ED" stroke="#D6E0EA" stroke-width="1.5"/>
<text x="1360" y="1364" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#247C66" font-weight="600" text-anchor="start">Precheck → acción tipada → postcheck</text>
<text x="1360" y="1395" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#247C66" font-weight="400" text-anchor="start">Sin shell ni código generado por el modelo.</text>
<rect x="1107" y="1436" width="758" height="150" rx="12" fill="white" stroke="#D6E0EA" stroke-width="1.5"/>
<rect x="1125" y="1452" width="119" height="36" rx="18" fill="#E5EAF4"/>
<text x="1184.5" y="1477" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#52667C" font-weight="600" text-anchor="middle">RESULTADO</text>
<text x="1266" y="1478" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#247C66" font-weight="600" text-anchor="start">Postcheck correcto: éxito verificable.</text>
<line x1="1127" y1="1502" x2="1844" y2="1502" stroke="#D6E0EA" stroke-width="2"/>
<text x="1127" y="1534" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#A56110" font-weight="400" text-anchor="start">Si falla tras el cambio: intentar restaurar y registrar</text>
<text x="1127" y="1565" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#A56110" font-weight="400" text-anchor="start">también el resultado de la restauración.</text>
<line x1="1790" y1="1639" x2="1170" y2="1639" stroke="#247C66" stroke-width="2.3" stroke-dasharray="8 5" marker-end="url(#arrow-green)"/>
<text x="1480.0" y="1626" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#247C66" font-weight="400" text-anchor="middle">Resultado + estado del rollback, si procede</text>
<line x1="1170" y1="1709" x2="830" y2="1709" stroke="#247C66" stroke-width="2.3" marker-end="url(#arrow-green)"/>
<text x="1000.0" y="1696" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#247C66" font-weight="400" text-anchor="middle">Resultado + evidencia</text>
<rect x="60" y="1762" width="1800" height="65" rx="14" fill="#EAF0F7"/>
<text x="84" y="1803" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#52667C" font-weight="400" text-anchor="start">El feedback no aprueba una nueva versión. Los dobles de prueba no demuestran una inferencia LLM real.</text>
</svg>
