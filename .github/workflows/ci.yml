name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev,test]"
          python -m pip check

      - name: Build package once
        run: python -m hatchling build

      - name: Essential static checks
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m mypy src

      - name: Deterministic smoke tests
        run: |
          python -m pytest \
            tests/integration/test_api_contracts.py \
            tests/integration/test_central_demo.py \
            tests/integration/test_operational_artifacts.py \
            tests/integration/test_public_boundaries.py
